<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prayer Interaction App</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        #app-screen { 
            position: relative;
            width: 100%;
            height: calc(100vh - 85px); /* 하단 바 높이를 뺀 나머지 전체를 메인 화면으로 강제 고정 */
            background-color: #000;
            cursor: pointer; 
        }
        
        /* 텍스트 컨테이너 정렬 강제 고정 */
        .text-container {
            position: absolute;
            top: 10%;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 15;
            padding: 0 20px;
            pointer-events: none;
        }

        .text-container h1 {
            font-size: 28px;
            font-weight: 500;
            margin: 0 0 12px 0;
            color: #ffffff;
        }

        .text-container p {
            font-size: 14px;
            font-weight: 300;
            margin: 0;
            color: #aaaaaa;
            line-height: 1.6;
        }
        
        /* 빛 효과 무조건 화면 중앙 배치 */
        #glow { 
            position: absolute; 
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; 
            height: 350px; 
            background: radial-gradient(circle, rgba(255,253,220,0.7) 0%, rgba(0,0,0,0) 75%); 
            border-radius: 50%; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            pointer-events: none; 
            z-index: 5; 
        }
        
        /* 손 이미지 무조건 화면 중앙 배치 */
        #hands { 
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; 
            height: auto; 
            z-index: 10; 
            pointer-events: none; 
        }
        
        #interface { 
            height: 85px; 
            background-color: #000000; 
            display: flex; 
            border-top: 1px solid #1a1a1a; 
            z-index: 20; 
            padding-bottom: env(safe-area-inset-bottom);
            width: 100%;
            max-width: 480px; 
            margin: 0 auto;  
        }
        
        .tab { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 15px; 
            color: #555555; 
            cursor: pointer; 
            position: relative;
            transition: color 0.3s ease;
        }
        
        .tab.active { 
            color: #ffffff; 
            font-weight: 600;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 16px;
            width: 24px;
            height: 2px;
            background-color: #fff;
            border-radius: 1px;
        }
    </style>
</head>
<body>

    <div id="app-screen">
        <div class="text-container">
            <h1>Prayer</h1>
            <p>
                Touch the screen to fold your hands and send your heart<br>
                once again to the one you miss.<br>
                <br>
                <span style="font-size: 12px; color: #555;">(You can select your religion from the bottom bar.)</span>
            </p>
        </div>

        <div id="glow"></div>
        <img id="hands" src="./hands_separated.png" alt="Hands">
    </div>

    <div id="interface">
        <div class="tab active" onclick="selectReligion('none', this)">Solace</div>
        <div class="tab" onclick="selectReligion('buddhism', this)">Buddhism</div>
        <div class="tab" onclick="selectReligion('christian', this)">Christian</div>
        <div class="tab" onclick="selectReligion('catholic', this)">Catholic</div>
    </div>

    <audio id="audio-bg" src="./bg_ambient.mp3" loop preload="auto"></audio>
    <audio id="audio-buddhism" src="./buddhism.mp3" loop preload="auto"></audio>
    <audio id="audio-christian" src="./christian.mp3" loop preload="auto"></audio>
    <audio id="audio-catholic" src="./catholic.mp3" loop preload="auto"></audio>

    <script>
        let currentReligion = 'none'; 
        const screen = document.getElementById('app-screen');
        const glow = document.getElementById('glow');
        const hands = document.getElementById('hands');
        const bgAudio = document.getElementById('audio-bg');

        let isBgPlaying = false;

        function selectReligion(religion, element) {
            stopAllReligionAudio();
            currentReligion = religion;
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }

        function stopAllReligionAudio() {
            ['buddhism', 'christian', 'catholic'].forEach(id => {
                const audio = document.getElementById(`audio-${id}`);
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }

        function startInteraction(e) {
            e.preventDefault();
            
            if (!isBgPlaying && bgAudio) {
                bgAudio.play().then(() => { isBgPlaying = true; }).catch(err => console.log(err));
            }

            // 이미지 경로에 ./ 적용
            hands.src = './hands_praying.png';
            glow.style.opacity = '1';
            
            if (currentReligion === 'none') {
                if (bgAudio) bgAudio.volume = 0.6;
            } else {
                if (bgAudio) bgAudio.volume = 0.1;
                const currentAudio = document.getElementById(`audio-${currentReligion}`);
                if (currentAudio) currentAudio.play().catch(err => console.log(err));
            }
        }

        function endInteraction(e) {
            hands.src = './hands_separated.png';
            glow.style.opacity = '0';
            
            if (currentReligion === 'none') {
                if (bgAudio && isBgPlaying) bgAudio.volume = 0.2;
            } else {
                const currentAudio = document.getElementById(`audio-${currentReligion}`);
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0; 
                }
                if (bgAudio && isBgPlaying) bgAudio.volume = 0.2;
            }
        }

        screen.addEventListener('mousedown', startInteraction);
        screen.addEventListener('mouseup', endInteraction);
        screen.addEventListener('mouseleave', endInteraction);

        screen.addEventListener('touchstart', startInteraction, { passive: false });
        screen.addEventListener('touchend', endInteraction);
        screen.addEventListener('touchcancel', endInteraction);
    </script>
</body>
</html>
