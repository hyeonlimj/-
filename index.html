<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Prayer Interaction App</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 메인 터치 영역 */
        #app-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; cursor: pointer; }
        
        /* ✨ 텍스트 컨테이너 (화면 상단에 고정) */
        .text-container {
            position: absolute;
            top: 12%; /* 화면 위쪽에서 적당히 떨어진 위치 */
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 15; /* 손과 빛보다 위에 배치 */
            padding: 0 20px;
            pointer-events: none; /* 터치 조작이 방해받지 않도록 설정 */
        }

        /* 제목 스타일 */
        .text-container h1 {
            font-size: 26px;
            font-weight: 500;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); /* 어두운 배경에서 글씨가 더 잘 보이도록 그림자 효과 */
        }

        /* 설명글 스타일 */
        .text-container p {
            font-size: 14px;
            font-weight: 300;
            margin: 0;
            color: #aaaaaa; /* 살짝 톤다운된 회색 */
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        
        /* 은은한 빛 효과 */
        #glow { position: absolute; width: 350px; height: 350px; background: radial-gradient(circle, rgba(255,253,220,0.7) 0%, rgba(0,0,0,0) 75%); border-radius: 50%; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 5; }
        
        /* 손 이미지 */
        #hands { width: 220px; height: auto; z-index: 10; pointer-events: none; margin-top: 60px; /* 글씨 공간을 고려해 약간 아래로 내림 */ }
        
        /* 하단 인터페이스 */
        #interface { height: 75px; background-color: #000000; display: flex; border-top: 1px solid #222; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
        .tab { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 15px; color: #555555; cursor: pointer; position: relative; transition: color 0.3s ease; }
        .tab.active { color: #ffffff; font-weight: 600; }
        .tab.active::after { content: ''; position: absolute; bottom: 12px; width: 24px; height: 2px; background-color: #fff; border-radius: 1px; }
    </style>
</head>
<body>

    <div id="app-screen">
        <div class="text-container">
            <h1>작품 제목</h1>
            <p>여기에 작품을 설명하는 글이나<br>안내 문구를 적으세요.</p>
        </div>

        <div id="glow"></div>
        <img id="hands" src="hands_separated.png" alt="Hands">
    </div>

    <div id="interface">
        <div class="tab active" onclick="selectReligion('none', this)">Solace</div>
        <div class="tab" onclick="selectReligion('buddhism', this)">Prayers</div>
        <div class="tab" onclick="selectReligion('christian', this)">R.I.P</div>
        <div class="tab" onclick="selectReligion('catholic', this)">Condolences</div>
    </div>

    <audio id="audio-bg" src="bg_ambient.mp3" loop preload="auto"></audio>
    <audio id="audio-buddhism" src="buddhism.mp3" loop preload="auto"></audio>
    <audio id="audio-christian" src="christian.mp3" loop preload="auto"></audio>
    <audio id="audio-catholic" src="catholic.mp3" loop preload="auto"></audio>

    <script>
        let currentReligion = 'none'; 
        const screen = document.getElementById('app-screen');
        const glow = document.getElementById('glow');
        const hands = document.getElementById('hands');
        const bgAudio = document.getElementById('audio-bg');

        let isBgPlaying = false;

        function selectReligion(religion, element) {
            stopAllReligionAudio();
            currentReligion = religion;
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }

        function stopAllReligionAudio() {
            ['buddhism', 'christian', 'catholic'].forEach(id => {
                const audio = document.getElementById(`audio-${id}`);
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }

        function startInteraction(e) {
            e.preventDefault();
            
            if (!isBgPlaying && bgAudio) {
                bgAudio.play().then(() => { isBgPlaying = true; }).catch(err => console.log(err));
            }

            hands.src = 'hands_praying.png';
            glow.style.opacity = '1';
            
            if (currentReligion === 'none') {
                if (bgAudio) bgAudio.volume = 0.6;
            } else {
                if (bgAudio) bgAudio.volume = 0.1;
                const currentAudio = document.getElementById(`audio-${currentReligion}`);
                if (currentAudio) currentAudio.play().catch(err => console.log(err));
            }
        }

        function endInteraction(e) {
            hands.src = 'hands_separated.png';
            glow.style.opacity = '0';
            
            if (currentReligion === 'none') {
                if (bgAudio && isBgPlaying) bgAudio.volume = 0.2;
            } else {
                const currentAudio = document.getElementById(`audio-${currentReligion}`);
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0; 
                }
                if (bgAudio && isBgPlaying) bgAudio.volume = 0.2;
            }
        }

        screen.addEventListener('mousedown', startInteraction);
        screen.addEventListener('mouseup', endInteraction);
        screen.addEventListener('mouseleave', endInteraction);

        screen.addEventListener('touchstart', startInteraction, { passive: false });
        screen.addEventListener('touchend', endInteraction);
        screen.addEventListener('touchcancel', endInteraction);
    </script>
</body>
</html>
